<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Chess - AI & Local</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            margin: 0;
            padding: 20px;
        }
        #board {
            width: 90vw;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .controls {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .status {
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.1em;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            background-color: #27ae60;
            border: none;
            color: white;
            border-radius: 5px;
            flex: 1 1 auto;
            min-width: 80px;
        }
        button:active {
            background-color: #2ecc71;
        }
        button:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }
        #modeBtn {
            background-color: #2980b9;
        }
        /* Move hints */
        .legal-move-hint {
            width: 20px;
            height: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h2 id="title">Chess: AI Mode</h2>
    <div id="board"></div>
    <div class="controls">
        <div class="status" id="status">White to move</div>
        
        <div class="button-group">
            <button id="undoBtn">Undo</button>
            <button id="redoBtn">Redo</button>
            <button id="flipBtn">Flip Board</button>
        </div>

        <div class="button-group">
            <button id="modeBtn">Switch to Local Play</button>
            <button id="resetBtn">New Game</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');
        var squareSelected = null;
        var gameMode = 'ai'; // 'ai' or 'local'
        var redoStack = [];

        function removeHighlights () {
            $('#board .square-55d63').css('background', '');
            $('.legal-move-hint').remove();
        }

        function highlightSquare (square) {
            var $square = $('#board .square-' + square);
            var background = '#a9a9a9';
            if ($square.hasClass('black-3c85d')) {
                background = '#696969';
            }
            $square.css('background', background);
        }

        function showLegalMoves (square) {
            var moves = game.moves({
                square: square,
                verbose: true
            });

            if (moves.length === 0) return;

            for (var i = 0; i < moves.length; i++) {
                var $square = $('#board .square-' + moves[i].to);
                $square.append('<div class="legal-move-hint"></div>');
            }
        }

        function makeBestMove () {
            if (game.game_over()) return;
            
            var possibleMoves = game.moves();
            if (possibleMoves.length === 0) return;

            var bestMove = null;
            var bestValue = -9999;

            for (var i = 0; i < possibleMoves.length; i++) {
                var move = possibleMoves[i];
                game.move(move);
                var boardValue = -evaluateBoard(game.board());
                game.undo();
                if (boardValue > bestValue) {
                    bestValue = boardValue;
                    bestMove = move;
                }
            }

            game.move(bestMove || possibleMoves[Math.floor(Math.random() * possibleMoves.length)]);
            board.position(game.fen());
            updateStatus();
        }

        function evaluateBoard (board) {
            var totalEvaluation = 0;
            for (var i = 0; i < 8; i++) {
                for (var j = 0; j < 8; j++) {
                    totalEvaluation = totalEvaluation + getPieceValue(board[i][j]);
                }
            }
            return totalEvaluation;
        }

        function getPieceValue (piece) {
            if (piece === null) return 0;
            var getAbsoluteValue = function (piece) {
                if (piece.type === 'p') return 10;
                if (piece.type === 'r') return 50;
                if (piece.type === 'n') return 30;
                if (piece.type === 'b') return 30;
                if (piece.type === 'q') return 90;
                if (piece.type === 'k') return 900;
                throw "Unknown piece type: " + piece.type;
            };
            var absoluteValue = getAbsoluteValue(piece);
            return piece.color === 'w' ? absoluteValue : -absoluteValue;
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        function updateStatus () {
            var status = '';
            var moveColor = 'White';
            if (game.turn() === 'b') {
                moveColor = 'Black';
            }

            if (game.in_checkmate()) {
                status = 'Game over, ' + moveColor + ' is in checkmate.';
            } else if (game.in_draw()) {
                status = 'Game over, drawn position';
            } else {
                status = moveColor + ' to move';
                if (game.in_check()) {
                    status += ', ' + moveColor + ' is in check';
                }
            }

            $status.html(status);
            $('#undoBtn').prop('disabled', game.history().length === 0);
            $('#redoBtn').prop('disabled', redoStack.length === 0);
        }

        var config = {
            draggable: false,
            position: 'start',
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        board = Chessboard('board', config);

        // Click to move logic
        $('#board').on('click', '.square-55d63', function () {
            if (game.game_over()) return;
            
            // In AI mode, prevent moving for Black
            if (gameMode === 'ai' && game.turn() === 'b') return;

            var square = $(this).attr('data-square');

            if (squareSelected) {
                var move = game.move({
                    from: squareSelected,
                    to: square,
                    promotion: 'q'
                });

                if (move === null) {
                    // If move is illegal, check if we clicked another piece of the current turn's color
                    var piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        squareSelected = square;
                        removeHighlights();
                        highlightSquare(square);
                        showLegalMoves(square);
                    } else {
                        squareSelected = null;
                        removeHighlights();
                    }
                } else {
                    board.position(game.fen());
                    redoStack = []; // Clear redo stack on new move
                    updateStatus();
                    squareSelected = null;
                    removeHighlights();
                    
                    if (gameMode === 'ai' && !game.game_over()) {
                        window.setTimeout(makeBestMove, 250);
                    }
                }
            } else {
                var piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    squareSelected = square;
                    highlightSquare(square);
                    showLegalMoves(square);
                }
            }
        });

        $('#undoBtn').on('click', function() {
            var move = game.undo();
            if (move) {
                redoStack.push(move);
                // In AI mode, if we undo the AI move, we usually want to undo the human move too
                if (gameMode === 'ai' && game.turn() === 'b') {
                    var humanMove = game.undo();
                    if (humanMove) redoStack.push(humanMove);
                }
                board.position(game.fen());
                updateStatus();
            }
        });

        $('#redoBtn').on('click', function() {
            var move = redoStack.pop();
            if (move) {
                game.move(move);
                // In AI mode, redo the AI move as well if it exists
                if (gameMode === 'ai' && game.turn() === 'b' && redoStack.length > 0) {
                    var aiMove = redoStack.pop();
                    game.move(aiMove);
                }
                board.position(game.fen());
                updateStatus();
            }
        });

        $('#flipBtn').on('click', function() {
            board.orientation('flip');
        });

        $('#modeBtn').on('click', function() {
            if (gameMode === 'ai') {
                gameMode = 'local';
                $(this).text('Switch to AI Mode');
                $('#title').text('Chess: Local Multiplayer');
            } else {
                gameMode = 'ai';
                $(this).text('Switch to Local Play');
                $('#title').text('Chess: AI Mode');
                // Trigger AI if it's currently Black's turn
                if (game.turn() === 'b') makeBestMove();
            }
        });

        $('#resetBtn').on('click', function() {
            game.reset();
            board.start();
            squareSelected = null;
            redoStack = [];
            removeHighlights();
            updateStatus();
        });

        updateStatus();
    </script>
</body>
</html>
