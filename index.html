<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Chess vs AI</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            margin: 0;
            padding: 20px;
        }
        #board {
            width: 90vw;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .controls {
            text-align: center;
        }
        .status {
            margin-bottom: 10px;
            font-weight: bold;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #27ae60;
            border: none;
            color: white;
            border-radius: 5px;
        }
        button:active {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>

    <h2>Chess vs AI</h2>
    <div id="board"></div>
    <div class="controls">
        <div class="status" id="status">Your move (White)</div>
        <button id="resetBtn">New Game</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');
        var squareSelected = null;

        function removeHighlights () {
            $('#board .square-55d63').css('background', '');
        }

        function highlightSquare (square) {
            var $square = $('#board .square-' + square);
            var background = '#a9a9a9';
            if ($square.hasClass('black-3c85d')) {
                background = '#696969';
            }
            $square.css('background', background);
        }

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            if (piece.search(/^b/) !== -1) return false;
            removeHighlights();
            squareSelected = null;
        }

        function makeBestMove () {
            var possibleMoves = game.moves();
            if (possibleMoves.length === 0) return;

            var bestMove = null;
            var bestValue = -9999;

            for (var i = 0; i < possibleMoves.length; i++) {
                var move = possibleMoves[i];
                game.move(move);
                var boardValue = -evaluateBoard(game.board());
                game.undo();
                if (boardValue > bestValue) {
                    bestValue = boardValue;
                    bestMove = move;
                }
            }

            game.move(bestMove || possibleMoves[Math.floor(Math.random() * possibleMoves.length)]);
            board.position(game.fen());
            updateStatus();
        }

        function evaluateBoard (board) {
            var totalEvaluation = 0;
            for (var i = 0; i < 8; i++) {
                for (var j = 0; j < 8; j++) {
                    totalEvaluation = totalEvaluation + getPieceValue(board[i][j]);
                }
            }
            return totalEvaluation;
        }

        function getPieceValue (piece) {
            if (piece === null) return 0;
            var getAbsoluteValue = function (piece) {
                if (piece.type === 'p') return 10;
                if (piece.type === 'r') return 50;
                if (piece.type === 'n') return 30;
                if (piece.type === 'b') return 30;
                if (piece.type === 'q') return 90;
                if (piece.type === 'k') return 900;
                throw "Unknown piece type: " + piece.type;
            };
            var absoluteValue = getAbsoluteValue(piece);
            return piece.color === 'w' ? absoluteValue : -absoluteValue;
        }

        function onDrop (source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            updateStatus();
            window.setTimeout(makeBestMove, 250);
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        function updateStatus () {
            var status = '';
            var moveColor = 'White';
            if (game.turn() === 'b') {
                moveColor = 'Black';
            }

            if (game.in_checkmate()) {
                status = 'Game over, ' + moveColor + ' is in checkmate.';
            } else if (game.in_draw()) {
                status = 'Game over, drawn position';
            } else {
                status = moveColor + ' to move';
                if (game.in_check()) {
                    status += ', ' + moveColor + ' is in check';
                }
            }

            $status.html(status);
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        board = Chessboard('board', config);

        // Click to move logic
        $('#board').on('click', '.square-55d63', function () {
            if (game.game_over() || game.turn() === 'b') return;

            var square = $(this).attr('data-square');

            if (squareSelected) {
                var move = game.move({
                    from: squareSelected,
                    to: square,
                    promotion: 'q'
                });

                if (move === null) {
                    var piece = game.get(square);
                    if (piece && piece.color === 'w') {
                        squareSelected = square;
                        removeHighlights();
                        highlightSquare(square);
                    } else {
                        squareSelected = null;
                        removeHighlights();
                    }
                } else {
                    board.position(game.fen());
                    updateStatus();
                    squareSelected = null;
                    removeHighlights();
                    window.setTimeout(makeBestMove, 250);
                }
            } else {
                var piece = game.get(square);
                if (piece && piece.color === 'w') {
                    squareSelected = square;
                    highlightSquare(square);
                }
            }
        });

        $('#resetBtn').on('click', function() {
            game.reset();
            board.start();
            squareSelected = null;
            removeHighlights();
            updateStatus();
        });

        updateStatus();
    </script>
</body>
</html>
