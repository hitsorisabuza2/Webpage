name: Android build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Gradle variant to assemble
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          # Use gradlew if it exists, otherwise fall back to system gradle
          if [[ -f gradlew ]]; then
            chmod +x gradlew
            EXECUTABLE="./gradlew"
          else
            echo "Warning: gradlew not found, using system gradle"
            EXECUTABLE="gradle"
          fi
          variant="${{ inputs.variant }}"
          $EXECUTABLE "assemble${variant^}" --stacktrace
      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/**/*.aab
          if-no-files-found: warn
