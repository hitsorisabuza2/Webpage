name: Android build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Gradle variant to assemble
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Make Gradle executable
        if: hashFiles('gradlew') != ''
        run: chmod +x gradlew
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradlew ]]; then
            echo "No gradlew found. Create or open an Android/Gradle project first."
            exit 1
          fi
          variant="${{ inputs.variant }}"
          ./gradlew "assemble${variant^}" --stacktrace
      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/**/*.aab
          if-no-files-found: warn
